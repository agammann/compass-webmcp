name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compass-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:audit-policy
      - run: pnpm security:audit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm test:webmcp --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-webmcp.json
      - run: pnpm package:release
      - run: python scripts/unpack-release.py --out ../compass-clean-consumer
      - run: pnpm --dir ../compass-clean-consumer install --frozen-lockfile
      - run: pnpm --dir ../compass-clean-consumer build
      - run: pnpm --dir ../compass-clean-consumer test:e2e
      - run: pnpm --dir ../compass-clean-consumer test:webmcp --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-webmcp.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compass-source
          path: release-artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Verify release artifact round trip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compass-source
          path: release-artifacts-roundtrip
      - run: diff -r release-artifacts release-artifacts-roundtrip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-and-audit-results
          path: |
            test-results/
            reports/dependency-*
            ${{ runner.workspace }}/compass-clean-consumer/test-results/
          overwrite: true
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compass-source
          path: release-artifacts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({ github, context, core });
